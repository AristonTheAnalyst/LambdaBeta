# Lambda — PowerSync Sync Streams (edition 3)
#
# REPLACES the legacy bucket_definitions in the PowerSync Dashboard → Sync Streams.
# One user-scoped stream per table so each user gets only their own rows.
#
# Every query aliases the real PK as `id` — PowerSync requires a text PK column
# named `id` on the client. For the one composite-PK table (no server-side id),
# a synthetic id is built from the pair with a '-' separator.
#
# 2026-08-24 (schema redesign v2): fact_session_set → fact_session_exercise_set,
# dim_planned_session_set → dim_planned_session_exercise (+_set), new
# dim_planned_session_program join table; dim_exercise_variation_bridge removed.
#
# 2026-09-27 (program versions): + fact_program_revision. Deploying this
# triggers a full reprocessing/resync, so ship the app build that reads the
# table together with it.
#
# 2026-09-27 (program reviews): + fact_program_review. Second line on the same
# program-history work; deploying this reprocesses again, so ship the build
# that reads the table together with it.
#
# 2026-10-05 (reviews replace versions): − fact_program_revision. The snapshot
# it held now lives in fact_program_review.snapshot_content, so the table is
# dropped and this stream no longer names it. Deploy this BEFORE running
# 20261005130100_drop_program_revisions.sql — a stream naming a table that no
# longer exists fails validation and can take the whole stream down with it.
# That migration is held out of `supabase/migrations/` on purpose so a plain
# `db push` cannot take it early; it lives in `supabase/held_migrations/` with
# the landing instructions.
#
# 2026-10-06 (review baseline + exercise notes): + fact_program_review
# .baseline_content/.baseline_hash/.exercise_notes_json. No stream change —
# the row is already `SELECT *` — so deploying this file is only needed to
# record the columns; the migration alone is enough. If it IS redeployed, it
# reprocesses like any stream deploy: ship it alongside a build that tolerates
# a brief resync.
#
# 2026-10-06 (review workout sets): + fact_program_review.session_ids_json
# /.reviewed_sessions_json. No stream change — the row is already `SELECT *` —
# so deploying this file is only needed to record the columns; the migration
# alone is enough. Push 20261006130000_review_workout_sets.sql BEFORE shipping
# a build that writes the columns: against an unmigrated server the write earns
# PGRST204, which the client retries forever — a stalled upload checkpoint on
# that device, never an error the user sees.
#
# 2026-10-07 (standalone reviews): fact_program_review.program_id becomes
# NULLABLE (NULL = standalone — a pass over workouts and goals with no program),
# + fact_program_review.goal_ids_json / .workout_notes_json, + index on
# (user_id, created_date desc). No stream change — the row is already
# `SELECT *`. Push 20261007120000_standalone_reviews.sql BEFORE shipping a
# build that writes the shape: a client ahead of the migration hits PGRST204
# on the new columns (retried forever), and a null program_id against the old
# NOT NULL earns 23502 — which IS fatal, so the row lands in upload_failures
# and the review vanishes from that device's sync.
#
# 2026-10-08 (goal description): + fact_goal.goal_description. No stream change —
# the row is already `SELECT *` — so deploying this file is only needed to
# record the column; the migration alone is enough. Push
# 20261008120000_goal_description.sql BEFORE shipping a build that writes it:
# against an unmigrated server the upload earns PGRST204, which the client
# retries forever — a stalled upload checkpoint on that device, never an error
# the user sees.
#
# Deploy steps (PowerSync Dashboard → Sync Streams):
#   1. Replace the current YAML with this file.
#   2. Bump the app version BEFORE deploying — sync streams attach to app
#      versions, and the old app must keep the old streams until the new
#      build ships.
#   3. Validate, then Deploy.
#
# NOTE: if the app ever adds a synced table, update lib/core/powersync/schema.dart
# AND lib/core/powersync/database.dart AND this file — see the sync-contract skill.

config:
  edition: 3

streams:
  user_data:
    auto_subscribe: true
    queries:
      - SELECT *, user_id as id FROM dim_user WHERE user_id = auth.user_id()
      - SELECT *, session_id as id FROM fact_session WHERE user_id = auth.user_id()
      - SELECT *, custom_exercise_id as id FROM dim_exercise WHERE user_id = auth.user_id()
      - SELECT *, custom_variation_id as id FROM dim_variation WHERE user_id = auth.user_id()
      - SELECT *, user_weight_id as id FROM fact_bodyweight WHERE user_id = auth.user_id()
      - SELECT *, session_exercise_set_id as id FROM fact_session_exercise_set WHERE user_id = auth.user_id()
      - SELECT *, session_exercise_id as id FROM fact_session_exercise WHERE user_id = auth.user_id()
      - SELECT *, pr_view_setting_id as id FROM dim_pr_view_setting WHERE user_id = auth.user_id()
      - SELECT *, program_id as id FROM dim_program WHERE user_id = auth.user_id()
      - SELECT *, program_run_id as id FROM fact_program_run WHERE user_id = auth.user_id()
      - SELECT *, lesson_id as id FROM dim_lesson WHERE user_id = auth.user_id()
      - SELECT *, session_id as id FROM dim_planned_session WHERE user_id = auth.user_id()
      - SELECT *, planned_exercise_id as id FROM dim_planned_session_exercise WHERE user_id = auth.user_id()
      - SELECT *, planned_set_id as id FROM dim_planned_session_exercise_set WHERE user_id = auth.user_id()
      - SELECT *, planned_session_program_id as id FROM dim_planned_session_program WHERE user_id = auth.user_id()
      - SELECT *, goal_id as id FROM fact_goal WHERE user_id = auth.user_id()
      - SELECT *, review_id as id FROM fact_program_review WHERE user_id = auth.user_id()
      - SELECT *, block_id as id FROM dim_program_block WHERE user_id = auth.user_id()
      - SELECT *, (coach_user_id || '-' || athlete_user_id) as id FROM coaching_relationship WHERE coach_user_id = auth.user_id() OR athlete_user_id = auth.user_id()
